name: Actualizar Dashboard Xolos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: |
          python scraper_completo_v2_6_grupos_sub17.py

      - name: Validar y guardar datos
        run: |
          python Paso3_v2_6.py

      - name: Ejecutar análisis
        run: |
          python analisis_v2_6_grupos.py

      - name: Generar dashboard
        run: |
          python generar_dashboard_v2_9_estetico.py

      - name: Preparar dashboard para publicación
        run: |
          mkdir -p docs
          cp xolos_dashboard_v2_9.html docs/index.htm

      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualización automática del dashboard"
            git push
          fi
